<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Tiburón AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // ===== Giro 360° =====
    // El tiburón gira solo sobre su eje vertical. Al arrastrar el dedo (o el mouse)
    // lo giras a mano; el giro automático se pausa y vuelve 2 segundos después de soltar.
    const giro = {
      piezas: [],          // los object3D que giran
      arrastrando: false,
      ultimoX: 0,
      reanudarEn: 0,       // momento en que vuelve el giro automático
      pausado: false       // botón Pausar
    };

    AFRAME.registerComponent('giro-360', {
      schema: {
        velocidad: { default: 30 },  // grados por segundo (30 = una vuelta cada 12 s)
        inicio: { default: 0 }       // ángulo inicial en grados
      },
      init() {
        this.el.object3D.rotation.y = THREE.MathUtils.degToRad(this.data.inicio);
        giro.piezas.push(this.el.object3D);
      },
      tick(tiempo, dt) {
        if (!dt || giro.pausado || giro.arrastrando || performance.now() < giro.reanudarEn) return;
        this.el.object3D.rotation.y += THREE.MathUtils.degToRad(this.data.velocidad) * dt / 1000;
      }
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      giro.arrastrando = true;
      giro.ultimoX = e.clientX;
    });
    window.addEventListener('pointermove', (e) => {
      if (!giro.arrastrando) return;
      const dx = e.clientX - giro.ultimoX;
      giro.ultimoX = e.clientX;
      const radianes = THREE.MathUtils.degToRad(dx * 0.6);   // 0.6° por pixel
      giro.piezas.forEach((p) => { p.rotation.y += radianes; });
    });
    const soltar = () => {
      if (!giro.arrastrando) return;
      giro.arrastrando = false;
      giro.reanudarEn = performance.now() + 2000;
    };
    window.addEventListener('pointerup', soltar);
    window.addEventListener('pointercancel', soltar);
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
    #aviso {
      position: fixed; top: 12px; left: 12px; right: 12px;
      z-index: 10; padding: 10px; border-radius: 8px;
      background: #0d4a6b; color: white;
      font: 16px Arial, sans-serif; text-align: center;
      pointer-events: none;
      transition: opacity .3s;
    }
    #aviso.oculto { opacity: 0; }
    #aviso.error { background: #9b1c1c; }
    #controles {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; align-items: center; gap: 10px;
      padding: 8px 8px 8px 14px; border-radius: 999px;
      background: rgba(13, 74, 107, .85); color: white;
      font: 15px Arial, sans-serif; white-space: nowrap;
      transition: opacity .3s;
    }
    #controles.oculto { opacity: 0; pointer-events: none; }
    #pausa {
      border: 0; border-radius: 999px; padding: 8px 14px;
      background: white; color: #0d4a6b;
      font: bold 15px Arial, sans-serif; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="aviso">Autoriza la cámara y apunta a la tarjeta del tiburón</div>
  <div id="controles" class="oculto">
    <span>Desliza para girar 360°</span>
    <button id="pausa" type="button">⏸ Pausar</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets timeout="30000">
      <!-- Modelo 3D optimizado -->
      <a-asset-item id="tiburon" src="./tiburon.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0"
              look-controls="enabled: false"></a-camera>

    <!-- Luces para que el modelo no se vea oscuro -->
    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" intensity="1.5" position="1 2 3"></a-light>

    <!--
      3 niveles:
        1. Base: dónde va el tiburón sobre la tarjeta (position) y su inclinación (rotation en X).
        2. giro-360: gira sobre el eje vertical. "inicio" es el ángulo con el que arranca.
        3. El modelo, con su tamaño (scale) y un vaivén suave como si nadara.
      La tarjeta mide 1 de ancho.
    -->

    <!-- targetIndex 0 = marcador-tiburon.png -->
    <a-entity id="target-tiburon" mindar-image-target="targetIndex: 0">
      <a-entity position="0 -0.3 0.05" rotation="10 0 0">
        <a-entity giro-360="inicio: 62">
          <a-gltf-model src="#tiburon"
                        scale="0.8 0.8 0.8"
                        animation="property: position; from: 0 0 0; to: 0 0.04 0; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine"></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // Oculta el aviso mientras se vea la tarjeta y lo muestra cuando se pierde.
    const aviso = document.getElementById('aviso');
    const controles = document.getElementById('controles');
    const botonPausa = document.getElementById('pausa');
    const escena = document.querySelector('a-scene');
    const target = document.querySelector('#target-tiburon');

    botonPausa.addEventListener('click', () => {
      giro.pausado = !giro.pausado;
      botonPausa.textContent = giro.pausado ? '▶ Girar' : '⏸ Pausar';
    });

    escena.addEventListener('arReady', () => {
      aviso.textContent = 'Apunta la cámara a la tarjeta del tiburón';
    });
    escena.addEventListener('arError', () => {
      aviso.classList.add('error');
      aviso.classList.remove('oculto');
      aviso.textContent = 'No se pudo abrir la cámara. Revisa los permisos y abre la página con https.';
    });
    target.addEventListener('targetFound', () => {
      aviso.classList.add('oculto');
      controles.classList.remove('oculto');
    });
    target.addEventListener('targetLost', () => {
      aviso.textContent = 'Target perdido: vuelve a apuntar la cámara';
      aviso.classList.remove('oculto');
      controles.classList.add('oculto');
    });
  </script>
</body>
</html>
